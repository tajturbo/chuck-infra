# Application Provisioning Workflow
# Builds the Docker image and pushes to GCP Artifact Registry
# Triggered on: push to main (dev), tag creation (stg/prod)

name: Docker Build and Push
run-name: "Docker Build and Push: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'dev') || (startsWith(github.ref, 'refs/tags/v') && 'stg') || 'prod' }} (${{ github.ref_name }})"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "app/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev

env:
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: chuck-registry
  IMAGE_NAME: app

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          cd app
          pytest test_app.py -v --tb=short

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: write
      id-token: write

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      environment: ${{ steps.vars.outputs.environment }}
      version: ${{ steps.vars.outputs.version }}
      new_sha: ${{ steps.update-tag.outputs.new_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment and version
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger
            ENV="${{ inputs.environment }}"
            VERSION="${{ github.sha }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tag push - extract version, default to stg (promote to prod manually)
            VERSION="${GITHUB_REF#refs/tags/v}"
            ENV="stg"
          else
            # Push to main - dev only
            VERSION="${{ github.sha }}"
            ENV="dev"
          fi
          
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image_tag=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          
          echo "Environment: $ENV"
          echo "Version: $VERSION"
          echo "Image Tag: $SHORT_SHA"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          cd app
          docker build \
            --tag ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }} \
            --tag ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }} \
            --tag ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
            --label "git.sha=${{ github.sha }}" \
            --label "version=${{ steps.vars.outputs.version }}" \
            --label "environment=${{ steps.vars.outputs.environment }}" \
            .

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          docker push ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}
          docker push ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Update Terraform Image Tag
        id: update-tag
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && steps.vars.outputs.environment == 'dev')
        run: |
          echo 'image_tag = "${{ steps.vars.outputs.image_tag }}"' > infra/terraform.tfvars
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add infra/terraform.tfvars
          git commit -m "chore: update image tag to ${{ steps.vars.outputs.image_tag }}"
          git push
          echo "new_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Output image info
        run: |
          echo "## Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`${{ steps.vars.outputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.vars.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY

  infra-deploy:
    name: Infrastructure Deploy
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/infra-provision.yml
    with:
      environment: ${{ needs.build.outputs.environment }}
      action: apply
      ref: ${{ needs.build.outputs.new_sha || github.sha }}
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
