# Infrastructure Provisioning Workflow
# Deploys Terraform infrastructure for dev/stg/prod environments

name: Infrastructure Provision
run-name: "Terraform ${{ github.event_name == 'workflow_dispatch' && format('{0} on {1}', inputs.action, inputs.environment) || 'plan on dev' }} (${{ github.ref_name }})"

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - stg
          - prod
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_VERSION: '1.6.0'
  REGION: us-central1
  SECONDARY_REGION: us-east1

permissions:
  contents: read
  id-token: write
  pull-requests: write
  
jobs:
  terraform:
    name: Terraform Workflow
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    outputs:
      env: ${{ steps.vars.outputs.ENV }}
      action: ${{ steps.vars.outputs.ACTION }}
    
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Workflow Variables
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "ENV=dev" >> $GITHUB_ENV
            echo "ACTION=plan" >> $GITHUB_ENV
            echo "ENV=dev" >> $GITHUB_OUTPUT
            echo "ACTION=plan" >> $GITHUB_OUTPUT
          else
            echo "ENV=${{ inputs.environment }}" >> $GITHUB_ENV
            echo "ACTION=${{ inputs.action }}" >> $GITHUB_ENV
            echo "ENV=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "ACTION=${{ inputs.action }}" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=chuck-${{ env.ENV }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="environment=${{ env.ENV }}" \
            -var="region=${{ env.REGION }}" \
            -var="secondary_region=${{ env.SECONDARY_REGION }}" \
            -out=tfplan \
            -no-color
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: env.ACTION == 'apply'
        run: |
          terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: env.ACTION == 'destroy'
        run: |
          terraform destroy \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="environment=${{ env.ENV }}" \
            -var="region=${{ env.REGION }}" \
            -var="secondary_region=${{ env.SECONDARY_REGION }}" \
            -auto-approve

      - name: Terraform Outputs
        if: env.ACTION == 'apply'
        run: |
          echo "## Infrastructure Deployed - ${{ env.ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Outputs" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  run-tests:
    name: Run Integration Tests
    needs: terraform
    if: needs.terraform.outputs.action == 'apply' && success()
    uses: ./.github/workflows/integration-tests.yml
    with:
      environment: ${{ needs.terraform.outputs.env }}
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
